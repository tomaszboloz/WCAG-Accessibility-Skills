<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">WCAG Accessibility Skills architecture overview</title>
  <desc id="description">Developer and AI platforms invoke a command adapter, which loads input, runs audit rules, creates reports and manual-review work, then optionally delegates a fix task.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#020617"/><rect width="1200" height="500" fill="url(#grid)"/>
  <text x="60" y="60" fill="white" font-family="monospace" font-size="28" font-weight="bold">WCAG Accessibility Skills · architecture overview</text>
  <text x="60" y="90" fill="#94a3b8" font-family="monospace" font-size="16">Static evidence pipeline with explicit manual-review boundary</text>
  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M230 225H315"/><path d="M485 225H570"/><path d="M740 225H825"/><path d="M995 225H1060"/><path d="M655 285V355"/><path d="M910 285V355"/>
  </g>
  <g font-family="monospace" text-anchor="middle">
    <g><rect x="60" y="175" width="170" height="100" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="145" y="215" fill="white" font-size="18">Developer / agent</text><text x="145" y="242" fill="#cbd5e1" font-size="13">Claude · Codex · Gemini</text></g>
    <g><rect x="315" y="175" width="170" height="100" rx="10" fill="#083344" stroke="#22d3ee" stroke-width="2"/><text x="400" y="215" fill="white" font-size="18">Command adapter</text><text x="400" y="242" fill="#a5f3fc" font-size="13">validate · authorize</text></g>
    <g><rect x="570" y="175" width="170" height="100" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="655" y="215" fill="white" font-size="18">Audit engine</text><text x="655" y="242" fill="#a7f3d0" font-size="13">input · rules · evidence</text></g>
    <g><rect x="825" y="175" width="170" height="100" rx="10" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/><text x="910" y="215" fill="white" font-size="18">Reports</text><text x="910" y="242" fill="#ddd6fe" font-size="13">JSON · Markdown · HTML</text></g>
    <g><rect x="1060" y="175" width="110" height="100" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="2"/><text x="1115" y="215" fill="white" font-size="16">CI</text><text x="1115" y="242" fill="#fde68a" font-size="13">policy gate</text></g>
    <g><rect x="540" y="355" width="230" height="90" rx="10" fill="#881337" stroke="#fb7185" stroke-width="2"/><text x="655" y="392" fill="white" font-size="17">Manual review queue</text><text x="655" y="418" fill="#fecdd3" font-size="13">no automatic certification</text></g>
    <g><rect x="795" y="355" width="230" height="90" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/><text x="910" y="392" fill="white" font-size="17">Fix task payload</text><text x="910" y="418" fill="#fed7aa" font-size="13">host-authorized writes</text></g>
  </g>
</svg>
