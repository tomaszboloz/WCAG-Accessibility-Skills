name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run verify:line-endings
      - run: npm run verify:package
      - run: npm test
      - run: npm run validate
      - run: node bin/wcag-skill.js audit '<!doctype html><html lang="en"><head><title>CI fixture</title></head><body><main><h1>CI fixture</h1></main></body></html>' --fail-on none --output /tmp/wcag-audit.json
